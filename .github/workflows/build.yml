name: Build MiVibe Remote

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed-tests:
    name: Update feed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-updates.txt
      - name: Install update feed dependencies
        run: python -m pip install -r scripts/requirements-updates.txt
      - name: Test signed appcast generator
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  macos:
    name: macOS app and DMG
    runs-on: macos-26
    defaults:
      run:
        working-directory: platforms/macos
    steps:
      - uses: actions/checkout@v4
      - name: Configure update client build
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_ED25519_PUBLIC_KEY }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          base_url="${UPDATE_BASE_URL%/}"
          if [[ -n "$base_url" && "$base_url" != https://* ]]; then
            echo "::error::UPDATE_BASE_URL must be an absolute HTTPS URL"
            exit 1
          fi
          if [[ -n "$base_url" ]]; then
            python3 - "$base_url" <<'PY'
          import sys
          from urllib.parse import urlsplit
          parsed = urlsplit(sys.argv[1])
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("UPDATE_BASE_URL must not contain credentials, a query string, or a fragment")
          PY
          fi
          private_github_prefix="https://github.com/${GITHUB_REPOSITORY}/"
          if [[ "$REPOSITORY_IS_PRIVATE" == true && "$base_url" == "$private_github_prefix"* ]]; then
            echo "::error::Private GitHub Release URLs cannot be used as the client update origin"
            exit 1
          fi
          if [[ -n "$base_url" && -n "$UPDATE_PUBLIC_KEY" ]]; then
            echo "MIVIBE_APPCAST_URL=$base_url/macos-appcast.xml" >> "$GITHUB_ENV"
            echo "MIVIBE_UPDATE_ED25519_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
          else
            echo "External update origin or public key is not configured; building with updates safely disabled."
          fi
      - name: Install verification tools
        run: brew install ripgrep
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Run Swift tests
        run: swift test
      - name: Build and verify DMG
        run: |
          ./scripts/build-dmg.sh
          ./scripts/verify-dmg.sh
      - name: Upload macOS candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MiVibe-Remote-macOS
          path: |
            platforms/macos/dist/MiVibe-Remote-*.dmg
            platforms/macos/dist/MiVibe-Remote-*.dmg.sha256
          if-no-files-found: error
      - name: Upload macOS release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME"
          dist/MiVibe-Remote-*.dmg
          dist/MiVibe-Remote-*.dmg.sha256
          --clobber

  windows:
    name: Windows app and installer
    runs-on: windows-2025
    defaults:
      run:
        working-directory: platforms/windows
    steps:
      - uses: actions/checkout@v4
      - name: Configure update client build
        shell: pwsh
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_ED25519_PUBLIC_KEY }}
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $baseUrl = ([string] $env:UPDATE_BASE_URL).TrimEnd('/')
          if ($baseUrl -and (-not $baseUrl.StartsWith('https://'))) {
            Write-Error 'UPDATE_BASE_URL must be an absolute HTTPS URL'
            exit 1
          }
          if ($baseUrl) {
            $parsedBaseUrl = [Uri] $baseUrl
            if ($parsedBaseUrl.UserInfo -or $parsedBaseUrl.Query -or $parsedBaseUrl.Fragment) {
              Write-Error 'UPDATE_BASE_URL must not contain credentials, a query string, or a fragment'
              exit 1
            }
          }
          $privateGitHubPrefix = "https://github.com/$env:GITHUB_REPOSITORY/"
          if (($env:REPOSITORY_IS_PRIVATE -eq 'true') -and $baseUrl.StartsWith($privateGitHubPrefix)) {
            Write-Error 'Private GitHub Release URLs cannot be used as the client update origin'
            exit 1
          }
          if ($baseUrl -and $env:UPDATE_PUBLIC_KEY) {
            "MIVIBE_APPCAST_URL=$baseUrl/windows-appcast.xml" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MIVIBE_UPDATE_ED25519_PUBLIC_KEY=$env:UPDATE_PUBLIC_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host 'External update origin or public key is not configured; building with updates safely disabled.'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platforms/windows/requirements.txt
            platforms/windows/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check undefined names
        run: >
          python -m ruff check
          source/standalone/xiaomi_main.py
          source/standalone/environment_check.py
          source/remote_bridge_hub.py
          source/bridges/xiaomi
          --select F
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and test installer
        shell: pwsh
        run: >
          .\delivery\build-standalone-packages.ps1
          -Version 0.1.20
          -Product xiaomi
          -AllowUnsignedCandidate
      - name: Upload Windows candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MiVibe-Remote-Windows
          path: |
            platforms/windows/delivery/out/standalone/MiVibeRemoteSetup-*.exe
            platforms/windows/delivery/out/standalone/MiVibeRemoteSetup-*.exe.sha256
          if-no-files-found: error
      - name: Upload Windows release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload $env:GITHUB_REF_NAME
          delivery/out/standalone/MiVibeRemoteSetup-*.exe
          delivery/out/standalone/MiVibeRemoteSetup-*.exe.sha256
          --clobber
