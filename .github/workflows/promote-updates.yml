name: Promote MiVibe Remote stable updates

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to promote (for example v0.1.16)
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_STABLE to update every installed client
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mivibe-stable-update-feed
  cancel-in-progress: false

jobs:
  promote:
    name: Sign and promote published release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false &&
       github.event.release.prerelease == false &&
       startsWith(github.event.release.tag_name, 'v') &&
       vars.UPDATE_BASE_URL != '' &&
       vars.UPDATE_PUBLISH_MODE == 's3')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
      UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_ED25519_PUBLIC_KEY }}
      UPDATE_S3_PREFIX: ${{ vars.UPDATE_S3_PREFIX }}
    steps:
      - name: Require an explicit manual promotion
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$MANUAL_CONFIRMATION" != "PROMOTE_STABLE" ]]; then
            echo "::error::Manual promotion requires confirmation PROMOTE_STABLE"
            exit 1
          fi
      - name: Require external signed update configuration
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_BASE64 }}
          UPDATE_S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          UPDATE_S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
          UPDATE_S3_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          UPDATE_S3_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for required in \
            RELEASE_TAG \
            UPDATE_BASE_URL \
            UPDATE_PUBLIC_KEY \
            UPDATE_PRIVATE_KEY_BASE64 \
            UPDATE_S3_ENDPOINT \
            UPDATE_S3_BUCKET \
            UPDATE_S3_ACCESS_KEY_ID \
            UPDATE_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing required stable update setting: $required"
              exit 1
            fi
          done
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Stable update release tag must start with v"
            exit 1
          fi
          if [[ "$UPDATE_BASE_URL" != https://* ]]; then
            echo "::error::UPDATE_BASE_URL must be an absolute HTTPS URL"
            exit 1
          fi
          python3 - "$UPDATE_BASE_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          parsed = urlsplit(sys.argv[1])
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("UPDATE_BASE_URL must not contain credentials, a query string, or a fragment")
          PY
          private_github_prefix="https://github.com/${GITHUB_REPOSITORY}/"
          if [[ "$UPDATE_BASE_URL" == "$private_github_prefix"* ]]; then
            echo "::error::A private GitHub Release cannot be the client update origin"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-updates.txt
      - name: Install update feed dependencies
        run: python -m pip install -r scripts/requirements-updates.txt
      - name: Verify the release is published and stable
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --json body,isDraft,isPrerelease,publishedAt,tagName \
            > updates/release.json
          if [[ "$(jq -r .tagName updates/release.json)" != "$RELEASE_TAG" ]]; then
            echo "::error::Resolved release tag does not match $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(jq -r .isDraft updates/release.json)" != false ]]; then
            echo "::error::Draft releases cannot be promoted"
            exit 1
          fi
          if [[ "$(jq -r .isPrerelease updates/release.json)" != false ]]; then
            echo "::error::Prereleases cannot be promoted to the stable feed"
            exit 1
          fi
          published_at="$(jq -r '.publishedAt // empty' updates/release.json)"
          if [[ -z "$published_at" ]]; then
            echo "::error::Release has no publication timestamp"
            exit 1
          fi
          jq -r '.body // ""' updates/release.json > updates/release-notes.md
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          python scripts/validate_update_promotion.py expected-assets \
            --release-tag "$RELEASE_TAG" \
            --mac-plist platforms/macos/Resources/Info.plist \
            --output updates/promotion-metadata.json
          echo "mac_build_version=$(jq -r .macBuildVersion updates/promotion-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "mac_filename=$(jq -r .macFilename updates/promotion-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "windows_filename=$(jq -r .windowsFilename updates/promotion-metadata.json)" >> "$GITHUB_OUTPUT"
      - name: Download the published release installers
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAC_FILENAME: ${{ steps.release.outputs.mac_filename }}
          EXPECTED_WINDOWS_FILENAME: ${{ steps.release.outputs.windows_filename }}
        run: |
          set -euo pipefail
          mkdir -p updates/release updates/dist
          # A release may be published while the tag build is still uploading
          # the installers. Wait up to 15 minutes, but never promote a partial
          # release or silently choose between duplicate assets.
          for attempt in $(seq 1 31); do
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
              > updates/release-asset-names.txt
            if python scripts/validate_update_promotion.py check-release-assets \
              --metadata updates/promotion-metadata.json \
              --asset-names updates/release-asset-names.txt; then
              break
            else
              status=$?
            fi
            if [[ "$status" -ne 3 ]]; then
              exit 1
            fi
            if [[ "$attempt" -eq 31 ]]; then
              echo "::error::Timed out waiting 15 minutes for both published installers"
              exit 1
            fi
            echo "Waiting for exact release assets ($attempt/31): $EXPECTED_MAC_FILENAME and $EXPECTED_WINDOWS_FILENAME"
            sleep 30
          done
          gh release download "$RELEASE_TAG" \
            --dir updates/release \
            --pattern "$EXPECTED_MAC_FILENAME" \
            --pattern "$EXPECTED_WINDOWS_FILENAME"
          python scripts/validate_update_promotion.py check-local-assets \
            --metadata updates/promotion-metadata.json \
            --directory updates/release
      - name: Generate and verify signed appcasts
        env:
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          MAC_BUILD_VERSION: ${{ steps.release.outputs.mac_build_version }}
          MAC_FILENAME: ${{ steps.release.outputs.mac_filename }}
          WINDOWS_FILENAME: ${{ steps.release.outputs.windows_filename }}
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          if ! printf '%s' "$UPDATE_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_BASE64 is not valid base64"
            exit 1
          fi
          python scripts/generate_appcasts.py \
            --mac-asset "updates/release/$MAC_FILENAME" \
            --windows-asset "updates/release/$WINDOWS_FILENAME" \
            --private-key-file "$key_file" \
            --expected-public-key "$UPDATE_PUBLIC_KEY" \
            --base-url "${UPDATE_BASE_URL%/}" \
            --release-notes-file updates/release-notes.md \
            --published-at "$PUBLISHED_AT" \
            --mac-build-version "$MAC_BUILD_VERSION" \
            --output-dir updates/dist
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Reject same-version or rollback promotion
        run: |
          set -euo pipefail
          fetch_current_feed() {
            local feed_name="$1"
            local output_path="$2"
            curl --silent --show-error --location \
              --retry 5 --retry-all-errors \
              --header 'Cache-Control: no-cache' \
              --output "$output_path" \
              --write-out '%{http_code}' \
              "${UPDATE_BASE_URL%/}/$feed_name"
          }
          mac_status="$(fetch_current_feed macos-appcast.xml updates/current-macos-appcast.xml)"
          windows_status="$(fetch_current_feed windows-appcast.xml updates/current-windows-appcast.xml)"
          guard=(
            python scripts/validate_update_promotion.py check-upgrade
            --new-macos-appcast updates/dist/macos-appcast.xml
            --new-windows-appcast updates/dist/windows-appcast.xml
          )
          if [[ "$mac_status" == 200 && "$windows_status" == 200 ]]; then
            guard+=(
              --current-macos-appcast updates/current-macos-appcast.xml
              --current-windows-appcast updates/current-windows-appcast.xml
            )
          elif [[ "$mac_status" != 404 || "$windows_status" != 404 ]]; then
            echo "::error::Current feeds must both exist (200) or both be absent (404); macOS=$mac_status Windows=$windows_status"
            exit 1
          fi
          "${guard[@]}"
      - name: Upload immutable installers to external storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          UPDATE_S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          UPDATE_S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
        run: |
          set -euo pipefail
          prefix="${UPDATE_S3_PREFIX#/}"
          prefix="${prefix%/}"
          destination="s3://$UPDATE_S3_BUCKET"
          if [[ -n "$prefix" ]]; then
            destination="$destination/$prefix"
          fi
          aws s3 cp updates/release/ "$destination/" \
            --endpoint-url "$UPDATE_S3_ENDPOINT" \
            --recursive \
            --exclude '*' \
            --include '*.dmg' \
            --include '*.exe' \
            --cache-control 'public, max-age=31536000, immutable'
      - name: Verify public installer bytes before changing appcasts
        run: |
          set -euo pipefail
          for platform in macos windows; do
            download_url="$(jq -r ".assets.$platform.downloadURL" updates/dist/update-manifest.json)"
            expected_sha256="$(jq -r ".assets.$platform.sha256" updates/dist/update-manifest.json)"
            downloaded_file="updates/public-$platform-installer"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              "$download_url" \
              --output "$downloaded_file"
            printf '%s  %s\n' "$expected_sha256" "$downloaded_file" | sha256sum --check --strict
          done
      - name: Promote stable appcasts last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          UPDATE_S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          UPDATE_S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
        run: |
          set -euo pipefail
          prefix="${UPDATE_S3_PREFIX#/}"
          prefix="${prefix%/}"
          destination="s3://$UPDATE_S3_BUCKET"
          if [[ -n "$prefix" ]]; then
            destination="$destination/$prefix"
          fi
          aws s3 cp updates/dist/update-manifest.json "$destination/update-manifest.json" \
            --endpoint-url "$UPDATE_S3_ENDPOINT" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, max-age=0'
          aws s3 cp updates/dist/macos-appcast.xml "$destination/macos-appcast.xml" \
            --endpoint-url "$UPDATE_S3_ENDPOINT" \
            --content-type 'application/rss+xml; charset=utf-8' \
            --cache-control 'no-cache, max-age=0'
          aws s3 cp updates/dist/windows-appcast.xml "$destination/windows-appcast.xml" \
            --endpoint-url "$UPDATE_S3_ENDPOINT" \
            --content-type 'application/rss+xml; charset=utf-8' \
            --cache-control 'no-cache, max-age=0'
      - name: Verify the promoted public appcasts
        run: |
          set -euo pipefail
          for feed in macos-appcast.xml windows-appcast.xml; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              "${UPDATE_BASE_URL%/}/$feed" \
              --output "updates/promoted-$feed"
            cmp "updates/dist/$feed" "updates/promoted-$feed"
          done
      - name: Archive promoted files in the private GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view update-feed >/dev/null 2>&1; then
            gh release create update-feed \
              --target "$RELEASE_TAG" \
              --prerelease \
              --title "MiVibe Remote update feed archive" \
              --notes "Private archive only. Installed clients use UPDATE_BASE_URL, not this Release."
          fi
          gh release upload update-feed \
            updates/dist/macos-appcast.xml \
            updates/dist/windows-appcast.xml \
            updates/dist/update-manifest.json \
            updates/release/*.dmg \
            updates/release/*.exe \
            --clobber
